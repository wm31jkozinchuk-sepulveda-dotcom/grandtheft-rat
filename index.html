<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grand Theft Rat</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.72);
      --text: #e2e8f0;
      --gold: #fbbf24;
      --danger: #ef4444;
      --green: #34d399;
      --blue: #60a5fa;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 14px 30px rgba(0,0,0,0.25);
      z-index: 10;
      min-width: 260px;
      backdrop-filter: blur(8px);
    }

    #title {
      font-weight: 800;
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
    }

    .label { opacity: 0.9; }
    .value { font-weight: 700; }

    #message {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.14);
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: 12;
    }

    #message.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">Grand Theft Rat</div>
    <div class="row"><span class="label">Loot</span><span id="loot" class="value">0</span></div>
    <div class="row"><span class="label">Heat</span><span id="heat" class="value">1★</span></div>
    <div class="row"><span class="label">Cash</span><span id="cash" class="value">$0</span></div>
    <div class="row"><span class="label">Vehicle</span><span id="vehicle" class="value">On Foot</span></div>
  </div>

  <div id="message">Caught! Press R to restart</div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1220);
    scene.fog = new THREE.Fog(0x0b1220, 24, 180);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 18, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const clock = new THREE.Clock();

    const ambient = new THREE.HemisphereLight(0xdfe9ff, 0x111827, 1.2);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(20, 35, 10);
    scene.add(dirLight);

    const worldSize = 120;

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(worldSize, worldSize),
      new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.95, metalness: 0.12 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // Roads
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.9, metalness: 0.1 });
    for (let i = -5; i <= 5; i++) {
      const roadH = new THREE.Mesh(new THREE.BoxGeometry(6, 0.12, worldSize), roadMat);
      roadH.position.set(i * 12, 0.06, 0);
      scene.add(roadH);

      const roadV = new THREE.Mesh(new THREE.BoxGeometry(worldSize, 0.12, 6), roadMat);
      roadV.position.set(0, 0.06, i * 12);
      scene.add(roadV);
    }

    // Buildings
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x3b4252, roughness: 0.82, metalness: 0.15 });
    const rooftopMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.9 });
    const buildings = [];
    for (let x = -42; x <= 42; x += 10) {
      for (let z = -42; z <= 42; z += 10) {
        if (Math.abs(x) < 18 && Math.abs(z) < 18) continue;
        if (Math.random() < 0.2) continue;

        const h = 4 + Math.random() * 16;
        const b = new THREE.Mesh(new THREE.BoxGeometry(7, h, 7), buildingMat);
        b.position.set(x + (Math.random() - 0.5) * 2.2, h / 2, z + (Math.random() - 0.5) * 2.2);
        scene.add(b);
        buildings.push(b);

        const roof = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.4, 7.6), rooftopMat);
        roof.position.set(b.position.x, h + 0.2, b.position.z);
        scene.add(roof);
      }
    }

    // Sewer / safehouse
    const sewerDisc = new THREE.Mesh(
      new THREE.CylinderGeometry(9, 9, 0.5, 32),
      new THREE.MeshStandardMaterial({ color: 0x111827, emissive: 0x172033, roughness: 0.8 })
    );
    sewerDisc.position.set(32, 0.18, -28);
    sewerDisc.rotation.x = Math.PI / 2;
    scene.add(sewerDisc);

    const sewerRing = new THREE.Mesh(
      new THREE.TorusGeometry(9.5, 0.55, 12, 48),
      new THREE.MeshStandardMaterial({ color: 0x6b7280, emissive: 0x1f2937 })
    );
    sewerRing.rotation.x = Math.PI / 2;
    sewerRing.position.set(32, 0.3, -28);
    scene.add(sewerRing);

    const safehouse = new THREE.Group();
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 3.5, 10),
      new THREE.MeshStandardMaterial({ color: 0x94a3b8 })
    );
    pole.position.y = 1.75;
    safehouse.add(pole);

    const flag = new THREE.Mesh(
      new THREE.BoxGeometry(1.5, 1, 0.08),
      new THREE.MeshStandardMaterial({ color: 0x34d399, emissive: 0x0f766e })
    );
    flag.position.set(0.75, 2.5, 0);
    safehouse.add(flag);

    safehouse.position.set(32, 0, -28);
    scene.add(safehouse);

    function createRat() {
      const rat = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(1.2, 18, 18),
        new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 })
      );
      body.scale.set(1.3, 0.8, 2.2);
      body.position.y = 1.1;
      rat.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x7a4d22, roughness: 0.9 })
      );
      head.position.set(1.3, 1.5, 0);
      head.scale.set(1.15, 1, 1);
      rat.add(head);

      const snout = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.35, 0.65),
        new THREE.MeshStandardMaterial({ color: 0xe5d7b7, roughness: 0.9 })
      );
      snout.position.set(1.95, 1.1, 0);
      rat.add(snout);

      const tail = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.24, 2.7, 10),
        new THREE.MeshStandardMaterial({ color: 0x74441f })
      );
      tail.rotation.z = Math.PI / 2 + 0.8;
      tail.position.set(-2.1, 1.2, 0);
      rat.add(tail);

      const earL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshStandardMaterial({ color: 0x5b3416 }));
      earL.position.set(1.7, 2.2, -0.25);
      rat.add(earL);

      const earR = earL.clone();
      earR.position.z = 0.25;
      rat.add(earR);

      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
      eyeL.position.set(2.0, 1.55, -0.22);
      rat.add(eyeL);

      const eyeR = eyeL.clone();
      eyeR.position.z = 0.22;
      rat.add(eyeR);

      rat.position.y = 0.2;
      scene.add(rat);

      return rat;
    }

    const player = createRat();
    const playerState = {
      position: new THREE.Vector3(0, 0.2, 0),
      velocity: new THREE.Vector3(),
      radius: 1.4,
      speed: 10,
      sprintSpeed: 15.5,
      inCar: false,
      currentCar: null,
      cash: 0,
      loot: 0,
      heat: 1,
      carHeat: 0
    };

    player.position.copy(playerState.position);

    const lootList = [];
    const lootMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24,
      emissive: 0x5b3a1f,
      roughness: 0.4,
      metalness: 0.12
    });

    function spawnLoot(x = null, z = null) {
      const item = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.20, 12), lootMat);
      item.rotation.x = Math.PI / 2;
      item.position.set(
        x ?? (Math.random() * 100 - 50),
        0.8,
        z ?? (Math.random() * 100 - 50)
      );
      item.userData.value = 10 + Math.random() * 20;
      scene.add(item);
      lootList.push(item);
    }

    for (let i = 0; i < 24; i++) spawnLoot();

    const cars = [];
    function createCar(position, color = 0xff4d4d) {
      const car = new THREE.Group();

      const chassis = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 0.8, 4.4),
        new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.45 })
      );
      chassis.position.y = 0.8;
      car.add(chassis);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(2.0, 0.8, 2.1),
        new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.5, metalness: 0.4 })
      );
      cabin.position.set(0, 1.25, -0.3);
      car.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 12);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

      const wheelPositions = [
        [-1.15, 0.42, -1.5], [1.15, 0.42, -1.5],
        [-1.15, 0.42, 1.5], [1.15, 0.42, 1.5]
      ];

      wheelPositions.forEach(([x, y, z]) => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(x, y, z);
        car.add(w);
      });

      car.position.copy(position);
      scene.add(car);

      const carData = {
        mesh: car,
        yaw: 0,
        speed: 0,
        maxSpeed: 28,
        acceleration: 28,
        turnRate: 2.5,
        steering: 0,
        stolen: false
      };

      cars.push(carData);
      return carData;
    }

    const parkedSpots = [
      new THREE.Vector3(-25, 0, 15), new THREE.Vector3(-15, 0, 30),
      new THREE.Vector3(10, 0, -20), new THREE.Vector3(22, 0, 22),
      new THREE.Vector3(-35, 0, -15), new THREE.Vector3(18, 0, 35),
      new THREE.Vector3(42, 0, 0), new THREE.Vector3(-5, 0, -34),
      new THREE.Vector3(30, 0, -12), new THREE.Vector3(0, 0, 28)
    ];

    parkedSpots.forEach((pos, i) => {
      const color = new THREE.Color().setHSL((i / parkedSpots.length) * 0.8, 0.8, 0.6);
      createCar(pos, color.getHex());
    });

    const police = [];
    const copMat = new THREE.MeshStandardMaterial({ color: 0x60a5fa, emissive: 0x1d4ed8, roughness: 0.6, metalness: 0.3 });
    function createCop(position) {
      const group = new THREE.Group();

      const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.7, 2.1), copMat);
      body.position.y = 1.1;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), new THREE.MeshStandardMaterial({ color: 0xdbeafe }));
      head.position.y = 2.35;
      group.add(head);

      const light = new THREE.Mesh(
        new THREE.BoxGeometry(0.25, 0.18, 0.42),
        new THREE.MeshStandardMaterial({ color: 0xfef3c7, emissive: 0xfacc15 })
      );
      light.position.set(0, 1.95, 1.1);
      group.add(light);

      group.position.copy(position);
      scene.add(group);

      return {
        mesh: group,
        speed: 5.0 + Math.random() * 2.0,
        radius: 1.5
      };
    }

    const hud = {
      loot: document.getElementById('loot'),
      heat: document.getElementById('heat'),
      cash: document.getElementById('cash'),
      vehicle: document.getElementById('vehicle')
    };

    const messageEl = document.getElementById('message');
    let gameOver = false;

    function updateHUD() {
      hud.loot.textContent = String(playerState.loot);
      hud.heat.textContent = `${playerState.heat}★`;
      hud.cash.textContent = `$${playerState.cash}`;

      if (playerState.inCar && playerState.currentCar) {
        hud.vehicle.textContent = 'Stolen Car';
      } else {
        hud.vehicle.textContent = 'On Foot';
      }
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add('visible');
    }

    function hideMessage() {
      messageEl.classList.remove('visible');
    }

    function updateHeatFromLoot() {
      playerState.heat = Math.min(5, 1 + Math.floor(playerState.loot / 8) + playerState.carHeat);
    }

    function ensurePolice() {
      const desired = Math.min(9, 2 + playerState.heat);
      while (police.length < desired) {
        const pos = new THREE.Vector3(
          (Math.random() - 0.5) * 90,
          0,
          (Math.random() - 0.5) * 90
        );
        police.push(createCop(pos));
      }
    }

    function resetPolice() {
      police.forEach(cop => scene.remove(cop.mesh));
      police.length = 0;
      ensurePolice();
    }

    function resetGame() {
      gameOver = false;
      hideMessage();

      playerState.position.set(0, 0.2, 0);
      player.position.copy(playerState.position);

      playerState.loot = 0;
      playerState.cash = 0;
      playerState.heat = 1;
      playerState.carHeat = 0;
      playerState.inCar = false;
      playerState.currentCar = null;

      for (const item of lootList) scene.remove(item);
      lootList.length = 0;
      for (let i = 0; i < 24; i++) spawnLoot();

      for (const carData of cars) {
        if (carData.stolen) {
          scene.remove(carData.mesh);
          carData.stolen = false;
          carData.speed = 0;
        }
      }

      const oldCars = [...cars];
      cars.length = 0;

      for (const old of oldCars) {
        if (!old.stolen) {
          scene.remove(old.mesh);
        }
      }

      parkedSpots.forEach((pos, i) => {
        const color = new THREE.Color().setHSL((i / parkedSpots.length) * 0.8, 0.8, 0.6);
        createCar(pos.clone(), color.getHex());
      });

      resetPolice();
      updateHUD();
    }

    function getNearestCar() {
      let bestCar = null;
      let bestDist = Infinity;

      for (const carData of cars) {
        if (carData.stolen) continue;
        const d = carData.mesh.position.distanceTo(player.position);
        if (d < bestDist && d < 5) {
          bestDist = d;
          bestCar = carData;
        }
      }

      return bestCar;
    }

    function stealOrExitCar() {
      if (playerState.inCar && playerState.currentCar) {
        const carData = playerState.currentCar;
        carData.speed = 0;
        playerState.inCar = false;
        playerState.currentCar = null;
        player.visible = true;
        playerState.position.copy(carData.mesh.position);
        player.position.copy(playerState.position);
        return;
      }

      const target = getNearestCar();
      if (!target) return;

      playerState.inCar = true;
      playerState.currentCar = target;
      target.stolen = true;
      playerState.carHeat = 1;
      playerState.heat = Math.max(playerState.heat, 2);
      player.visible = false;
      updateHeatFromLoot();
    }

    const keys = {}; 
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'KeyE') {
        if (!gameOver) stealOrExitCar();
      }

      if (e.code === 'KeyR' && gameOver) {
        resetGame();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function updatePlayerOnFoot(dt) {
      const dir = new THREE.Vector3();

      if (keys.KeyW) dir.z -= 1;
      if (keys.S) dir.z += 1;
      if (keys.A) dir.x -= 1;
      if (keys.D) dir.x += 1;

      if (dir.lengthSq() > 0) {
        dir.normalize();
        const sprinting = keys.ShiftLeft || keys.ShiftRight;
        const speed = sprinting ? playerState.sprintSpeed : playerState.speed;
        playerState.position.x += dir.x * speed * dt;
        playerState.position.z += dir.z * speed * dt;

        const limit = worldSize * 0.5 - 5;
        playerState.position.x = THREE.MathUtils.clamp(playerState.position.x, -limit, limit);
        playerState.position.z = THREE.MathUtils.clamp(playerState.position.z, -limit, limit);

        const yaw = Math.atan2(dir.x, dir.z);
        player.rotation.y = yaw;
      }

      player.position.copy(playerState.position);
    }

    function updateCar(dt) {
      if (!playerState.inCar || !playerState.currentCar) return;

      const car = playerState.currentCar;
      const moveDir = new THREE.Vector2();

      if (keys.KeyW) moveDir.y -= 1;
      if (keys.S) moveDir.y += 1;
      if (keys.A) moveDir.x -= 1;
      if (keys.D) moveDir.x += 1;

      if (moveDir.lengthSq() > 0) {
        moveDir.normalize();
      }

      const acceleration = moveDir.y * car.acceleration * dt;
      car.speed += acceleration;
      car.speed *= 0.98;

      if (Math.abs(moveDir.x) > 0.01) {
        car.yaw += moveDir.x * car.turnRate * dt * (Math.abs(car.speed) / 18 + 0.25);
      }

      car.speed = THREE.MathUtils.clamp(car.speed, -12, car.maxSpeed);

      const forward = new THREE.Vector3(Math.sin(car.yaw), 0, Math.cos(car.yaw));
      car.mesh.position.addScaledVector(forward, car.speed * dt);

      const edge = worldSize * 0.5 - 6;
      car.mesh.position.x = THREE.MathUtils.clamp(car.mesh.position.x, -edge, edge);
      car.mesh.position.z = THREE.MathUtils.clamp(car.mesh.position.z, -edge, edge);
      car.mesh.rotation.y = car.yaw;

      playerState.position.copy(car.mesh.position);
      player.position.set(playerState.position.x, 0.2, playerState.position.z);
    }

    function updateCamera(dt) {
      let targetPos = playerState.position;

      if (playerState.inCar && playerState.currentCar) {
        const car = playerState.currentCar;
        const offset = new THREE.Vector3(Math.sin(car.yaw), 5.6, Math.cos(car.yaw)).multiplyScalar(-10);
        targetPos = car.mesh.position.clone().add(offset);
        camera.position.lerp(targetPos, 1 - Math.pow(0.004, dt));
        camera.lookAt(car.mesh.position.x, 1.2, car.mesh.position.z);
        return;
      }

      const behind = new THREE.Vector3(
        playerState.position.x - Math.sin(player.rotation.y) * 10,
        9,
        playerState.position.z - Math.cos(player.rotation.y) * 10
      );

      camera.position.lerp(behind, 1 - Math.pow(0.006, dt));
      camera.lookAt(playerState.position.x, 1.2, playerState.position.z);
    }

    function collectLoot() {
      for (let i = lootList.length - 1; i >= 0; i--) {
        const item = lootList[i];
        const d = item.position.distanceTo(playerState.position);
        if (d < 2.2) {
          playerState.cash += Math.round(item.userData.value);
          playerState.loot += 1;
          scene.remove(item);
          lootList.splice(i, 1);

          const x = playerState.position.x + (Math.random() - 0.5) * 25;
          const z = playerState.position.z + (Math.random() - 0.5) * 25;
          spawnLoot(x, z);

          updateHeatFromLoot();
        }
      }
    }

    function updateSafehouse() {
      const sewerPos = new THREE.Vector3(32, 0, -28);
      const dist = playerState.position.distanceTo(sewerPos);

      if (dist < 9) {
        playerState.heat = Math.max(1, playerState.heat - 0.1);
      } else if (!playerState.inCar) {
        playerState.heat = Math.max(1, playerState.heat - 0.02);
      }
    }

    function updatePolice(dt) {
      ensurePolice();

      for (const cop of police) {
        const target = playerState.inCar && playerState.currentCar ? playerState.currentCar.mesh.position : playerState.position;

        const toPlayer = new THREE.Vector3(
          target.x - cop.mesh.position.x,
          0,
          target.z - cop.mesh.position.z
        );

        const dist = toPlayer.length();
        if (dist < 0.001) continue;

        toPlayer.normalize();
        cop.mesh.position.addScaledVector(toPlayer, dt * cop.speed * (0.85 + playerState.heat * 0.42));
        cop.mesh.lookAt(target.x, 1.2, target.z);

        const close = dist < 2.4;
        if (close) {
          if (playerState.inCar) {
            playerState.heat = Math.min(5, playerState.heat + dt * 0.6);
          } else {
            gameOver = true;
            showMessage('Caught! Press R to restart');
          }
        }
      }
    }

    function updateWantedLevel() {
      playerState.heat = Math.min(5, Math.max(1, playerState.heat));
      ensurePolice();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());

      if (!gameOver) {
        if (playerState.inCar) {
          updateCar(dt);
        } else {
          updatePlayerOnFoot(dt);
        }

        collectLoot();
        updateSafehouse();
        updateWantedLevel();
        updatePolice(dt);
        updateCamera(dt);
      } else {
        updateCamera(dt);
      }

      updateHUD();
      renderer.render(scene, camera);
    }

    resetGame();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
